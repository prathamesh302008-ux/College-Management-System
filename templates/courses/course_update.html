{% extends 'base/base.html' %}

{% block title %}

Update Course

{% endblock %}

{% block content %}

<div class="student-page">

    <div class="form-card">

        <h1>

            Update Course

        </h1>

        <p>

            Update Course Details

        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-fields">

                {{ form.as_p }}

            </div>

            <button type="submit" class="save-btn">

                Update Course

            </button>

        </form>

        <br>

        <a href="{% url 'course_list' %}" class="back-btn">

            ← Back To Course List

        </a>

    </div>

</div>

{% endblock %}
