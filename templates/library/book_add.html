{% extends 'base/base.html' %}

{% block title %}

Add Book

{% endblock %}

{% block content %}

<div class="student-page">

    <div class="form-card">

        <h1>

            Add Book

        </h1>

        <p>

            Enter Book Details

        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-fields">

                {{ form.as_p }}

            </div>

            <button type="submit" class="save-btn">

                Save Book

            </button>

        </form>

        <br>

        <a href="{% url 'book_list' %}" class="back-btn">

            ← Back To Library

        </a>

    </div>

</div>

{% endblock %}
