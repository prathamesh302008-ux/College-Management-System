{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>College Management System</title>


<link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>


<body>


<div class="background">

<div class="overlay"></div>

</div>



<div class="main-container">


<div class="left-panel">


<div class="college-name">


<h1>
COLLEGE
</h1>


<h2>
MANAGEMENT
</h2>


<h3>
SYSTEM
</h3>


<p>
Professional College ERP Portal
</p>


</div>


</div>





<div class="right-panel">


<div class="login-box">


<h2>
Welcome Back
</h2>


<p>
Login to Continue
</p>



<form method="POST">


{% csrf_token %}



<div class="input-group">


<label>
Username
</label>


<input 
type="text"
name="username"
placeholder="Enter Username"
required>


</div>





<div class="input-group">


<label>
Password
</label>


<input
type="password"
name="password"
placeholder="Enter Password"
required>


</div>





<div class="input-group">


<label>
Login As
</label>


<select name="role">


<option value="Principal">
Principal
</option>


<option value="HOD">
HOD
</option>


<option value="Faculty">
Faculty
</option>


<option value="Student">
Student
</option>


</select>


</div>





<button type="submit">

LOGIN

</button>





{% if error %}

<p style="color:red;text-align:center;">

{{error}}

</p>

{% endif %}





</form>




<div class="bottom-text">


College Management System

<br>

Version 1.0


</div>


</div>


</div>



</div>


</body>


</html>
