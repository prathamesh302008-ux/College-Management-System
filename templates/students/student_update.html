{% extends 'base/base.html' %}


{% block title %}

Update Student

{% endblock %}



{% block content %}



<div class="student-page">


    <div class="form-card">


        <h1>
            Update Student
        </h1>


        <p>
            Edit Student Details
        </p>



        <form method="POST">


            {% csrf_token %}



            <div class="form-fields">


                {{ form.as_p }}


            </div>



            <button type="submit" class="save-btn">

                Update Student

            </button>



        </form>



        <br>


        <a href="{% url 'student_list' %}" class="back-btn">

            ← Back To Student List

        </a>


    </div>


</div>



{% endblock %}
