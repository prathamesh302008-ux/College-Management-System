{% extends 'base/base.html' %}

{% block title %}

Update Faculty

{% endblock %}

{% block content %}

<div class="student-page">

    <div class="form-card">

        <h1>

            Update Faculty

        </h1>

        <p>

            Update Faculty Details

        </p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-fields">

                {{ form.as_p }}

            </div>

            <button type="submit" class="save-btn">

                Update Faculty

            </button>

        </form>

        <br>

        <a href="{% url 'faculty_list' %}" class="back-btn">

            ← Back To Faculty List

        </a>

    </div>

</div>

{% endblock %}
